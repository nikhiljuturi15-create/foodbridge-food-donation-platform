version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=foodbridge_production_secret_key_hack_p197
      - JWT_EXPIRES_IN=7d
    volumes:
      - server-data:/app/prisma

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  server-data:
